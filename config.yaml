generator_model: Sonnet 4.6 Thinking    # writes the ground-truth Q&A
gt_judges:                                      # 3-judge ground-truth validation panel

- Nemotron 3 Super 120b a12
- Gemini Flash 3
- OSS 120b
benchmark_models:                                                   # candidates under test

- OSS 120b
- OSS 20b
- Granite 3.3 Instruct
- Llama 3.3 70b
- Nemotron 3 Nano 30ba3
- Mistral Small 3.1
- Llama 3.1 8b
- Gemma 4 31b
- Gemma 3 27b
eval_mode: single                       # "single" | "triple"  -> which benchmark grader to use
eval_judge: Nemotron 3 Super 120b a12   # used when eval_mode == single
eval_judges: []                                   # used when eval_mode == triple

validation:
  # Ground-truth validation: the gt_judges panel scores each generated Q&A. By default, questions
  # the judges DOUBTED (they disagree, or all mark the reference answer wrong) are flagged for
  # human review and kept in the benchmark set until a human resolves them.
  auto_drop_disagreements: true         # true -> automatically DROP any question not unanimously
                                        # accepted by the judges (disagreement OR unanimous-wrong),
                                        # skipping human review. Dropped items are recorded in
                                        # results/human_review/auto_dropped_groundtruth.csv; the
                                        # generated ground_truth.csv is left intact.

# -----------------------------------------------------------------------------
# Dataset settings
# -----------------------------------------------------------------------------
runs_per_model: 3
questions_per_area: 100
question_type_split:                    # must sum to questions_per_area
  recall: 34
  conceptual: 33
  applied: 33
dedupe:
  similarity_threshold: 88              # rapidfuzz token_set_ratio (0-100); >= this == near-duplicate

generation:
  # Ground-truth generation auto-retries: any question that fails the readability band, the LLM
  # appropriateness gate, or dedupe is dropped (logged to results/reports/generation_rejects.csv)
  # and regenerated for that exact (area, standard, type) slot until the target is met.
  max_rounds: 20                        # upper bound on regeneration passes (stops early once quota met)
  overgen: 1.6                          # request ~60% extra per slot so filtering still leaves enough
  stuck_patience: 2                     # consecutive zero-accept rounds before a slot is declared stuck
  # When a (standard, type) slot is stuck (e.g. only so many distinct in-band questions exist), its
  # remaining need is REDISTRIBUTED to sibling standards in the same area+type, so the AREA still hits
  # its per-type quota. The run only ends short if EVERY standard for an area+type is exhausted.

appropriateness:
  fk_grade_range: [5.0, 9.0]            # middle-school Flesch-Kincaid band for question filtering
  llm_check: true                       # also run an LLM appropriateness gate per question

# Standardized, FAIR decoding applied identically to every benchmarked model:
benchmark_protocol:
  temperature:                          # null = omit temperature (each model uses its default).
                                        # Set a number to standardize across models that accept it;
                                        # models that need a fixed/omitted temp use per-model overrides.
  max_tokens:                           # null = NO output cap, so each model answers to completion
                                        # (reasoning models need this). Set a number only to cap.
  system_prompt: middle_school          # key into prompts.SYSTEM_PROMPTS
  shots: 0                              # zero-shot; no per-model tuning

# Grading: binary 0/1 is the headline metric everywhere; ALSO collect a 3-level
# rubric (0=incorrect, 0.5=partial, 1=correct) for these question types.
grading:
  rubric_for: [conceptual, applied]

calibration:
  sample_per_cell: 3                    # stratified human-label sample size per area x question_type

# -----------------------------------------------------------------------------
# Paths (relative to repo root)
# -----------------------------------------------------------------------------
paths:
  standards_yaml: data/standards.yaml
  ground_truth: data/ground_truth.csv
  ground_truth_validated: data/ground_truth_validated.csv
  responses_dir: results/responses
  eval_dir: results/eval
  calibration_dir: results/calibration
  human_review_dir: results/human_review
  reports_dir: results/reports
  areas_doc: docs/areas_overview.md
