# =============================================================================
# NGSS MS-Science LLM Benchmark — single configuration file
# Secrets live in .env (referenced by `api_key_env`), never here.
# =============================================================================

defaults:
  # Temperatures are OPTIONAL. Leave a value `null` (or blank) to NOT send temperature at all,
  # so the model uses its own default. This matters for models that reject an explicit
  # temperature or require a specific value (e.g. some reasoning models). Per-model overrides
  # live in the `models` registry below (`temperature:` / `omit_temperature:`).
  temperature_generation: 0.7   # some diversity when writing the question bank (set null to omit)
  temperature_answer:           # benchmarking answers; null = use each model's default
  temperature_judge:            # judging; null = use each judge's default (do not force 0)
  # Output length: null = DO NOT send a max-token limit, so each model produces its full
  # answer/reasoning (models reason for differing lengths). Set a number only if you want a cap.
  max_tokens_generation:        # question-bank generation
  max_tokens_judge:             # judge / appropriateness calls
  request_timeout: 120          # seconds per API call (raise for slow reasoning models)

concurrency:
  max_parallel_requests: 8      # bounded worker pool per stage; raise to go faster, set 1 to debug

retry:
  max_attempts: 5               # automatic retry on transient API errors
  backoff_seconds: 2            # initial exponential backoff
  max_backoff: 60               # cap

checkpoint:
  enabled: true
  flush_every: 25               # write partial results every N items so runs are resumable

# -----------------------------------------------------------------------------
# Model registry. Add/remove freely — anything here can be used as a generator,
# judge, or benchmarked model just by referencing its key below.
# Every entry is queried through the OpenAI-compatible API (base_url + key).
# Pin DATED model snapshots in `model:` for reproducibility where the provider offers them.
# Optional per-model temperature handling:
#   temperature: <float>     always send this exact temperature for this model
#   omit_temperature: true   never send a temperature for this model (use its own default)
# (these override the `defaults`/`benchmark_protocol` temperatures above)
# -----------------------------------------------------------------------------
